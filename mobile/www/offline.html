<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packmates</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; box-sizing: border-box; text-align: center; color: #fff;
    font: 18px/1.4 -apple-system, system-ui, sans-serif;
    background: linear-gradient(180deg, #6d28d9 0%, #9333ea 45%, #c026d3 75%, #db2777 100%);
  }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; max-width: 20em; }
  a { margin-top: 8px; padding: 14px 32px; border-radius: 999px; background: #000; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <!-- Shown when packmates.live can't be reached (server.errorPath). -->
  <h1>You're offline</h1>
  <p>Packmates needs the internet to show meetups. Check your connection.</p>
  <a href="https://www.packmates.live/">Try again</a>
</body>
</html>
