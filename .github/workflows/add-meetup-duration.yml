name: Add meetup duration (database)

# One-time change (see scripts/add-meetup-duration.mjs): adds an empty,
# optional "durationMins" column to meetups. Run it before the app that
# uses it goes out; the app before that ignores the column. Safe to re-run.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/add-meetup-duration.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
