name: Open signup and thumbs up (database)

# One-time schema change for open signup, thumbs up and verified members
# (see prisma/migrations/20261004120000_open_signup_and_thumbs_up). Turso
# speaks HTTP rather than the wire protocol prisma migrate deploy needs, so
# the change is applied by a small idempotent script instead. Safe to
# re-run.
#
# Run this BEFORE the deploy that contains the change: the new code reads
# the new columns and table on every page.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/open-signup-and-thumbs-up.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
