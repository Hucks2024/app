name: Set a new admin password

# Manual-only, for when the admin has forgotten their password and email
# isn't set up to reset it. First add a repository secret called
# NEW_ADMIN_PASSWORD (Settings -> Secrets and variables -> Actions), then
# Actions tab -> "Set a new admin password" -> "Run workflow". Secrets
# never show in the log. Delete the secret afterwards.
on:
  workflow_dispatch:

jobs:
  password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/set-admin-password.mjs
        env:
          NEW_ADMIN_PASSWORD: ${{ secrets.NEW_ADMIN_PASSWORD }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
