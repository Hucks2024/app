name: Add XRP payment tracking to database

# Manual-only. Run this once (Actions tab → "Add XRP payment tracking to
# database" → "Run workflow") to add the columns/table the XRP membership
# feature needs. Idempotent, safe to re-run, it skips whatever already
# exists.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @libsql/client
      - name: Add XRP payment columns/table
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/add-xrp-payments.mjs
