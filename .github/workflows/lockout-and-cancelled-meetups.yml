name: Login lockout and cancelled meetups (database)

# One-time schema change (see
# prisma/migrations/20261004140000_lockout_and_cancelled_meetups). Turso
# speaks HTTP rather than the wire protocol prisma migrate deploy needs, so
# the change is applied by a small idempotent script instead. Safe to
# re-run.
#
# Run this BEFORE the deploy that contains the change: the new code reads
# the new columns on every sign in and every map load.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/lockout-and-cancelled-meetups.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
