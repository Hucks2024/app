name: Add map coordinates to RunActivity

# Manual-only. Run this once (Actions tab → "Add map coordinates to
# RunActivity" → "Run workflow") to add the latitude/longitude columns the
# map view needs. Idempotent — safe to re-run, it skips if the columns
# already exist.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @libsql/client
      - name: Add latitude/longitude columns
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/add-map-coordinates.mjs
