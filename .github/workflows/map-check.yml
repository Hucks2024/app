name: Map check (one-off)

# Opens the live site in a real browser to check the map is drawn from
# OpenFreeMap. Read-only; nothing personal is printed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/map-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.55.0 sharp@0.34.5
      - run: npx playwright install --with-deps chromium
      - run: node check.mjs
