name: Cloudflare

# Builds the app for Cloudflare Workers (OpenNext, see wrangler.jsonc) and
# sends it up. Until the two Cloudflare secrets below are added it only
# checks the app builds for Cloudflare.
#
# Secrets (Settings -> Secrets and variables -> Actions), never in this
# file: the repository is public.
#   CLOUDFLARE_API_TOKEN   Cloudflare -> My Profile -> API Tokens, from the
#                          "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare -> Workers & Pages -> Account ID
# and the app's own, handed to it as Cloudflare secrets: TURSO_DATABASE_URL,
# TURSO_AUTH_TOKEN, RESEND_API_KEY, and any of SESSION_SECRET, EMAIL_FROM,
# APP_STORE_URL, GOOGLE_PLAY_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# APPLE_CLIENT_ID that are set. With no SESSION_SECRET, the first deploy
# makes one that nobody ever sees, and it's kept from then on.
on:
  workflow_dispatch:
  push:
    branches: [main]

# One at a time, so an older build never lands after a newer one.
concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build

      - name: Send to Cloudflare
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          APP_STORE_URL: ${{ secrets.APP_STORE_URL }}
          GOOGLE_PLAY_URL: ${{ secrets.GOOGLE_PLAY_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # No session key anywhere yet (the first deploy): make one.
          if [ -z "$SESSION_SECRET" ]; then
            if LIST=$(npx wrangler secret list --format json 2>"$RUNNER_TEMP/list.err"); then
              HAS=$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>console.log(JSON.parse(s.slice(s.indexOf("["), s.lastIndexOf("]") + 1)).some((x)=>x.name==="SESSION_SECRET")))')
            elif grep -qiE "not found|10007" "$RUNNER_TEMP/list.err"; then
              HAS=false
            else
              cat "$RUNNER_TEMP/list.err"; exit 1
            fi
            if [ "$HAS" = false ]; then
              SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')
              echo "::add-mask::$SESSION_SECRET"
              export SESSION_SECRET
              echo "Made a new session key."
            fi
          fi

          # The app's secrets go up with it, from a file only this run can
          # read, deleted straight after. Ones not set are left as they are.
          SECRETS="$RUNNER_TEMP/secrets.json"
          node -e '
            const names = ["TURSO_DATABASE_URL", "TURSO_AUTH_TOKEN", "SESSION_SECRET", "RESEND_API_KEY", "EMAIL_FROM",
              "APP_STORE_URL", "GOOGLE_PLAY_URL", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "APPLE_CLIENT_ID",
              "TURNSTILE_SITE_KEY", "TURNSTILE_SECRET_KEY"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(set), { mode: 0o600 });
            console.log("Secrets sent:", Object.keys(set).join(", ") || "none");
          ' "$SECRETS"
          npx opennextjs-cloudflare deploy -- --secrets-file "$SECRETS"
          rm -f "$SECRETS"
