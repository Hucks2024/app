name: Add deleted email table (database)

# One-time change (see scripts/add-deleted-email.mjs): adds an empty table
# for the fingerprints of deleted accounts' emails. Run it before the app
# that uses it goes out. Safe to re-run.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/add-deleted-email.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
