name: Health check

# Manual-only and read-only. Actions tab -> "Health check" -> "Run
# workflow". Prints counts of members and meetups, and whether sign-up
# codes are going out by email. Never prints a name or an email address:
# this repository is public, and so are its logs.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/health-check.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
