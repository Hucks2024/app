name: Add indexes (database)

# One-time change (see scripts/add-indexes.mjs): adds four indexes so the
# busiest pages read fewer rows. Safe to re-run, and safe either side of
# the deploy: the code works the same with or without them, only faster.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/add-indexes.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
