name: Process XRP membership payments

# Runs on a schedule to check the XRP Ledger for new payments to the
# membership wallet and credit them to the matching member. Also runnable
# manually (Actions tab → "Process XRP membership payments" → "Run
# workflow") for testing.
#
# XRP_WALLET_ADDRESS is not sensitive (it's meant to be public, that's how
# receiving crypto payments works) so it's a plain env value here, not a
# secret.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @libsql/client
      - name: Process payments
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          XRP_WALLET_ADDRESS: rfVyq5iAAdxk8jMQcSoGCVvBaXoEJiH9iV
        run: node scripts/process-xrp-payments.mjs
