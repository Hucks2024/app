name: Database update, 22 October (one-time)

# One-time change (see scripts/db-update-oct22.mjs): adds how long a meetup
# takes, who it's for, and members' gender, with everyone who joined before
# set to male. Run it before the app that uses them goes out; the app
# before that ignores the new columns. Safe to re-run.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/db-update-oct22.mjs
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
