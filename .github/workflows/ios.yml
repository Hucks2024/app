name: iPhone app

# Builds the App Store app (mobile/) on GitHub's own Macs, so no Mac is
# needed. Until the App Store Connect secrets below are added, it only
# checks the app builds. With them, it signs the app and sends it to App
# Store Connect, where it shows up in TestFlight, ready to submit for
# review.
#
# Secrets (Settings -> Secrets and variables -> Actions), never in this
# file: the repository is public.
#   APPLE_TEAM_ID   developer.apple.com -> Account -> Membership details
#   ASC_KEY_ID      App Store Connect -> Users and Access -> Integrations
#   ASC_ISSUER_ID     -> App Store Connect API (a key with the Admin role)
#   ASC_KEY         that key's .p8 file, all of it, BEGIN and END lines too
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-latest
    env:
      CAN_UPLOAD: ${{ secrets.ASC_KEY != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Capacitor's tools need 22 or newer.
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios

      # The App Store only takes apps built with a recent Xcode.
      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check it builds
        if: env.CAN_UPLOAD != 'true'
        run: |
          source ../.github/ios-quiet.sh
          quiet build xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      # Apple keeps the signing certificate (cloud signing), so nothing
      # secret lives on this machine beyond the API key, for this run only.
      # Each run's number is the build number, which must always go up.
      - name: Sign and send to App Store Connect
        if: env.CAN_UPLOAD == 'true'
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          source ../.github/ios-quiet.sh
          export LC_ALL=C
          # Copying on a phone can add spaces or lose line breaks, so tidy
          # the secrets, and say which one is wrong (never what's in it).
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            printf -v "$v" '%s' "$(printf '%s' "${!v}" | tr -d '[:space:]')"
            echo "::add-mask::${!v}"
          done
          bad() { echo "::error::$1"; exit 1; }
          [[ $ASC_KEY_ID =~ ^[A-Z0-9]{10}$ ]] || bad "ASC_KEY_ID should be 10 capital letters and numbers (the key's Key ID)."
          [[ $ASC_ISSUER_ID =~ ^[0-9a-fA-F-]{36}$ ]] || bad "ASC_ISSUER_ID should look like 1a2b3c4d-1a2b-1a2b-1a2b-1a2b3c4d5e6f (the Issuer ID)."

          # The key is rebuilt from its letters and numbers alone.
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          BODY=$(printf '%s' "$ASC_KEY" | sed -E 's/(BEGIN|END)[^A-Za-z0-9]*PRIVATE[^A-Za-z0-9]*KEY//g' | tr -cd 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout 2>/dev/null ||
            bad "ASC_KEY isn't a whole .p8 key: it has ${#BODY} key characters, and Apple's have about 184. Paste all of the .p8 file into it again."
          TEAM_FILE="$RUNNER_TEMP/team" KEY_PATH="$KEY_PATH" ASC_KEY_ID="$ASC_KEY_ID" ASC_ISSUER_ID="$ASC_ISSUER_ID" node ../.github/asc-check.mjs
          if [[ -s $RUNNER_TEMP/team ]]; then
            ACCOUNT_TEAM=$(cat "$RUNNER_TEMP/team")
            echo "::add-mask::$ACCOUNT_TEAM"
            if [[ $ACCOUNT_TEAM == "$TEAM_ID" ]]; then
              echo "APPLE_TEAM_ID matches the account."
            else
              echo "::warning::APPLE_TEAM_ID isn't this account's Team ID (which ends in ${ACCOUNT_TEAM: -3}), so the build uses the account's."
              TEAM_ID=$ACCOUNT_TEAM
            fi
          fi
          [[ $TEAM_ID =~ ^[A-Z0-9]{10}$ ]] || bad "APPLE_TEAM_ID should be 10 capital letters and numbers (developer.apple.com, Account, Membership details)."
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Built unsigned: signing it here would need an iPhone registered
          # to the account. The export below signs it for the App Store.
          quiet archive xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          quiet upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          rm -f "$KEY_PATH"
